[project]
name = "x-bookmark-migrator"
version = "0.1.0"
description = "Small official X API bookmark read pilot"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29"]

[project.scripts]
x-migrator = "x_bookmark_migrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
